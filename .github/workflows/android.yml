name: android

# Every push builds and lints the app. A tag vX.Y.Z additionally builds the
# signed release APK and publishes it as a GitHub Release, which is where the
# dashboard's Settings → App tab and the in-app updater pick it up.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to commit SHAs, as in the other
      # zer0space repos: a tag can be repointed, a SHA cannot.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.11.1'

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            if ! [[ "$tag" =~ ^v[0-9]{1,3}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
              echo "::error::tag $tag is not vMAJOR.MINOR.PATCH"
              exit 1
            fi
            echo "version=$tag" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.1" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint and build (debug + unsigned release)
        if: steps.version.outputs.release != 'true'
        run: gradle --no-daemon -PappVersion=${{ steps.version.outputs.version }} lintDebug assembleDebug assembleRelease

      - name: Upload the debug APK
        if: steps.version.outputs.release != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zer0space-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # --- release (tags only) ------------------------------------------------

      - name: Decode the signing key
        if: steps.version.outputs.release == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ZS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Actions secret ZS_KEYSTORE_BASE64 is not set (see docs/release.md)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zs-release.p12"
          echo "ZS_KEYSTORE_PATH=$RUNNER_TEMP/zs-release.p12" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        if: steps.version.outputs.release == 'true'
        env:
          ZS_KEYSTORE_PASSWORD: ${{ secrets.ZS_KEYSTORE_PASSWORD }}
          ZS_KEY_ALIAS: ${{ secrets.ZS_KEY_ALIAS }}
          ZS_KEY_PASSWORD: ${{ secrets.ZS_KEY_PASSWORD }}
        run: gradle --no-daemon -PappVersion=${{ steps.version.outputs.version }} lintRelease assembleRelease

      - name: Verify the signature and name the file
        if: steps.version.outputs.release == 'true'
        id: apk
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::no signed APK produced (signing config missing?)"; exit 1; }
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          rm -f "$RUNNER_TEMP/zs-release.p12"
          version="${{ steps.version.outputs.version }}"
          name="zer0space-${version#v}.apk"
          mkdir -p dist
          cp "$apk" "dist/$name"
          (cd dist && sha256sum "$name" > SHA256SUMS)
          cat dist/SHA256SUMS
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.version }}"
          notes="$(git tag -l --format='%(contents)' "$tag")"
          [ -n "$notes" ] || notes="zer0space for Android ${tag}"
          gh release create "$tag" dist/*.apk dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "zer0space ${tag}" --notes "$notes"
    permissions:
      contents: write
